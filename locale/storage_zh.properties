inventory/storage/invalid=物品栏尺寸或物品数据无效。
inventory/storage/overflow=物品数量将超出上限。
inventory/storage/insufficient=可用物品不足。
inventory/storage/missing=物品组或容器已不存在。
inventory/storage/no_space=空闲空间不足。
inventory/storage/incompatible=这些物品组无法合并。
inventory/storage/operation_conflict=此操作标识已用于其他数据。
inventory/storage/budget=存储日志已达到上限。
inventory/storage/settings=容器尺寸
inventory/storage/columns=列数（0 表示不限）
inventory/storage/rows=行数（0 表示不限）
inventory/storage/apply=应用并排列
inventory/storage/split=将物品组均分
inventory/storage/drag_hint=拖动以移动；按住 R 旋转；放到兼容物品组上以合并。
