inventory/storage/invalid=所持品の寸法またはアイテムデータが無効です。
inventory/storage/overflow=アイテム数が上限を超えます。
inventory/storage/insufficient=利用できるアイテムが不足しています。
inventory/storage/missing=グループまたは容器が見つかりません。
inventory/storage/no_space=空きスペースが不足しています。
inventory/storage/incompatible=このグループは結合できません。
inventory/storage/operation_conflict=この操作 ID は別のデータで使用されています。
inventory/storage/budget=保管履歴が上限に達しました。
inventory/storage/settings=容器のサイズ
inventory/storage/columns=列数（0 は無制限）
inventory/storage/rows=行数（0 は無制限）
inventory/storage/apply=適用して配置
inventory/storage/split=グループを半分に分割
inventory/storage/drag_hint=ドラッグで移動、R を押しながら回転、互換グループに重ねて結合。
